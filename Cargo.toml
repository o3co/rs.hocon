[package]
name = "hocon-parser"
version = "1.10.0"
edition = "2021"
rust-version = "1.82"
description = "Full Lightbend HOCON specification-compliant parser for Rust"
license = "Apache-2.0"
repository = "https://github.com/o3co/rs.hocon"
keywords = ["hocon", "config", "configuration", "parser", "rust"]
categories = ["config", "parser-implementations"]
readme = "README.md"

# docs.rs renders with default features unless told otherwise, and every
# adapter is feature-gated — without this the `adapters` module documents as
# empty and none of its rustdoc is visible to users.
[package.metadata.docs.rs]
all-features = true

[lib]
name = "hocon"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
include-package = []

# Format adapters. Each is opt-in so the default build still depends on
# indexmap alone; properties, env and json5 need nothing extra.
adapters-properties = []
adapters-env = []
adapters-json5 = []
adapters-jsonc = ["dep:serde_json"]
adapters-toml = ["dep:toml"]
adapters-yaml = ["dep:yaml-rust2"]
# The fixture harness in tests/format_ingestion_test.rs reads JSON manifests,
# so the umbrella feature pulls serde_json in for tests as well.
adapters = [
    "adapters-properties",
    "adapters-env",
    "adapters-json5",
    "adapters-jsonc",
    "adapters-toml",
    "adapters-yaml",
]

[dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
# Capped to the 1.0 line deliberately: toml 1.1 raised its MSRV to 1.85,
# which would make `rust-version` above untrue for this one feature. The
# 1.0 line needs 1.76 and is still maintained. Raising this cap is an MSRV
# decision, so make it one — the MSRV CI job runs --all-features and will
# fail the moment this stops holding.
toml = { version = "~1.0", optional = true }
yaml-rust2 = { version = "0.11", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = ">=3.19, <3.20"

[[bench]]
name = "parse_bench"
harness = false
