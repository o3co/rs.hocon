[package]
name = "hocon-parser"
version = "1.9.0"
edition = "2021"
rust-version = "1.82"
description = "Full Lightbend HOCON specification-compliant parser for Rust"
license = "Apache-2.0"
repository = "https://github.com/o3co/rs.hocon"
keywords = ["hocon", "config", "configuration", "parser", "rust"]
categories = ["config", "parser-implementations"]
readme = "README.md"

[lib]
name = "hocon"

[features]
default = []
serde = ["dep:serde", "dep:serde_json"]
include-package = []

# Format adapters. Each is opt-in so the default build still depends on
# indexmap alone; properties and env need nothing extra.
adapters-properties = []
adapters-env = []
adapters-jsonc = ["dep:serde_json"]
adapters-toml = ["dep:toml"]
adapters-yaml = ["dep:yaml-rust2"]
# The fixture harness in tests/format_ingestion_test.rs reads JSON manifests,
# so the umbrella feature pulls serde_json in for tests as well.
adapters = [
    "adapters-properties",
    "adapters-env",
    "adapters-jsonc",
    "adapters-toml",
    "adapters-yaml",
]

[dependencies]
indexmap = "2"
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }
toml = { version = "1", optional = true }
yaml-rust2 = { version = "0.11", optional = true }

[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tempfile = ">=3.19, <3.20"

[[bench]]
name = "parse_bench"
harness = false
